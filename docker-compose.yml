# Local development only. Production uses Neon (Postgres) and Cloudflare R2 (S3).
# Both services here speak the same protocols, so the app code is identical.
# S3Mock instead of MinIO: MinIO pulled its public Docker images in 2026; S3Mock
# is a small, actively published S3-compatible server that creates buckets from env.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage
      POSTGRES_DB: triage
    volumes:
      - pgdata:/var/lib/postgresql/data

  s3:
    image: adobe/s3mock:latest
    ports:
      - "9090:9090"
    environment:
      initialBuckets: triage-attachments
      # keep objects between restarts
      retainFilesOnExit: "true"
      root: /data
    volumes:
      - s3data:/data

volumes:
  pgdata:
  s3data:
